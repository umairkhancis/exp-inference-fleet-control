# Registers the existing (bring-your-own) minikube cluster running in the
# "inference-cluster-2" multipass VM. Same shape as inference-cluster-1;
# the only capability difference is the class: cpu-micro-byo (2 cores).
#
# Prerequisites (handled by scripts/add-inference-cluster.sh):
#   - kubeconfig Secret inference-cluster-2-kubeconfig on the control cluster
#   - node labels modelplane.ai/pool=cpu-pool and modelplane.ai/cpu=true
#   - a LoadBalancer implementation on the cluster (MetalLB)
apiVersion: modelplane.ai/v1alpha1
kind: InferenceCluster
metadata:
  name: inference-cluster-2
  labels:
    modelplane.ai/region: local
spec:
  cluster:
    source: Existing
    existing:
      secretRef:
        name: inference-cluster-2-kubeconfig
        key: kubeconfig
  nodePools:
  - name: cpu-pool
    className: cpu-micro-byo
    nodeCount: 1
