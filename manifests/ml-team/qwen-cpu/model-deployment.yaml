# Qwen2.5-0.5B-Instruct served by vLLM on CPU, adapted from the official
# qwen2.5-0.5b-cpu recipe for this PoC fleet:
#   - multi-arch image tag (v0.32.0 includes arm64 — the recipe's
#     v0.32.0-x86_64 won't run on the Apple Silicon multipass VMs)
#   - the CEL selector is evaluated twice: by Modelplane's scheduler against
#     the DECLARED InferenceClass capacity (cpu-small-byo=3, cpu-micro-byo=2)
#     to pick a cluster, and by the node's DRA allocator against the REAL
#     device the dra.cpu driver publishes (2 cores on these VMs). It must
#     pass both, so it asks for >= 2. (A ">= 3" demand picks cluster-1 by
#     class but then never allocates on the node — the class declaration
#     overstates what the driver actually found.)
#   - sized for the small VM: 2 of the node's cores, 2048-token context,
#     1 GiB KV cache.
apiVersion: modelplane.ai/v1alpha1
kind: ModelDeployment
metadata:
  name: qwen-cpu-demo
  namespace: ml-team
spec:
  replicas: 1
  template:
    spec:
      engines:
      - name: qwen
        members:
        - role: Standalone
          nodeSelector:
            devices:
            - name: cpu
              count: 1
              selectors:
              - cel: |
                  device.capacity["dra.cpu"].cpu.compareTo(quantity("2")) >= 0
          template:
            spec:
              containers:
              - name: engine
                image: vllm/vllm-openai-cpu:v0.32.0
                args:
                - --model=Qwen/Qwen2.5-0.5B-Instruct
                - --served-model-name=$(MODELPLANE_SERVED_MODEL_NAME)
                - --max-model-len=2048
                - --block-size=32
                env:
                - name: VLLM_CPU_KVCACHE_SPACE
                  value: "1"
                # Give vLLM a bounded thread budget: enough to finish CPU
                # warmup/compilation inside the startup-probe window (1
                # thread was killed mid-warmup every ~7 min, looping
                # forever), but far below the all-6-cores default that
                # amplified the earlier cgroup thrash.
                - name: OMP_NUM_THREADS
                  value: "3"
                # Request 1 core: the 4-core node already carries ~2.6 cores
                # of platform pod requests (gateway, monitoring, DRA driver,
                # control plane), so a 2-core request never schedules. No CPU
                # limit — vLLM may burst into whatever is idle.
                resources:
                  requests:
                    cpu: "1"
                    memory: 2Gi
