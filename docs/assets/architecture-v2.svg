<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
  <!-- High-level architecture, phase 03. Hierarchy: Modelplane control cluster (k8s) on top;
       beneath it the two serving tiers it manages — the local k8s inference cluster (P0)
       and Anthropic's external Claude API (P1 failover). -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="75%">
      <stop offset="0%" stop-color="#111b32"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </radialGradient>
    <marker id="aGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#cbd5e1"/>
    </marker>
    <marker id="aBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#60a5fa"/>
    </marker>
    <marker id="aAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#f59e0b"/>
    </marker>
    <marker id="aDim" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#64748b"/>
    </marker>
    <filter id="glowBlue" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#3b82f6" flood-opacity="0.5"/>
    </filter>
    <filter id="glowAmber" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
    <filter id="glowTeal" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#2dd4bf" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bgGlow)"/>

  <text x="800" y="64" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="4" fill="#34d399">MODELPLANE ON KUBERNETES · PHASE 03</text>

  <!-- multipass container (holds both k8s clusters) -->
  <rect x="330" y="110" width="920" height="680" rx="18" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="5 6"/>
  <rect x="354" y="97" width="236" height="26" rx="13" fill="#0b1322" stroke="#475569"/>
  <text x="472" y="114" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#94a3b8">MULTIPASS · UBUNTU VMS</text>

  <!-- ====================== CONTROL CLUSTER (top) ====================== -->
  <rect x="370" y="160" width="820" height="230" rx="16" fill="none" stroke="#2b5e55" stroke-width="1.4" stroke-dasharray="5 6" filter="url(#glowTeal)"/>
  <rect x="394" y="147" width="396" height="26" rx="13" fill="#0b1322" stroke="#2b5e55"/>
  <text x="592" y="164" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#2dd4bf">K8S CLUSTER · MODELPLANE · CONTROL PLANE</text>

  <rect x="410" y="205" width="740" height="50" rx="10" fill="#0d1526" stroke="#334155" stroke-width="1.4"/>
  <text x="780" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">modelplane v0.6 <tspan fill="#64748b" font-weight="400">· Crossplane · fleet controller · minikube</tspan></text>

  <rect x="410" y="280" width="220" height="72" rx="12" fill="#0d1526" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="520" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">ModelDeployment</text>
  <text x="520" y="332" text-anchor="middle" font-size="10.5" fill="#94a3b8">qwen-cpu-demo · 1 replica</text>

  <rect x="660" y="280" width="220" height="72" rx="12" fill="#0d1526" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="770" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">ModelService</text>
  <text x="770" y="332" text-anchor="middle" font-size="10.5" fill="#94a3b8">chat · P0 fleet / P1 claude</text>

  <rect x="910" y="280" width="220" height="72" rx="12" fill="#0d1526" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1020" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">ModelEndpoint</text>
  <text x="1020" y="332" text-anchor="middle" font-size="10.5" fill="#94a3b8">claude · api-key Secret</text>

  <text x="780" y="376" text-anchor="middle" font-size="11" fill="#64748b">declarative intent · reconciled by Crossplane</text>

  <!-- control -> inference cluster (down) -->
  <path d="M 760 392 L 760 460" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 5" marker-end="url(#aDim)"/>
  <text x="774" y="420" font-size="11" fill="#64748b">programs routes ·</text>
  <text x="774" y="436" font-size="11" fill="#64748b">schedules engine</text>

  <!-- control -> claude (down-right) -->
  <path d="M 1162 330 C 1330 370, 1400 440, 1405 510" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 5" marker-end="url(#aDim)"/>
  <text x="1480" y="424" text-anchor="middle" font-size="11" fill="#64748b">defines endpoint ·</text>
  <text x="1480" y="440" text-anchor="middle" font-size="11" fill="#64748b">holds API-key Secret</text>

  <!-- ====================== SERVING TIER (bottom) ====================== -->
  <!-- inference cluster (P0) -->
  <rect x="370" y="470" width="820" height="290" rx="16" fill="none" stroke="#33537a" stroke-width="1.2" stroke-dasharray="5 6"/>
  <rect x="394" y="457" width="330" height="26" rx="13" fill="#0b1322" stroke="#33537a"/>
  <text x="559" y="474" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#60a5fa">K8S CLUSTER · INFERENCE-CLUSTER-1</text>

  <rect x="410" y="530" width="215" height="160" rx="14" fill="#0d1526" stroke="#ec4899" stroke-width="1.8"/>
  <text x="517" y="588" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9">Envoy</text>
  <text x="517" y="612" text-anchor="middle" font-size="12" fill="#94a3b8">AI gateway · extproc</text>
  <text x="517" y="632" text-anchor="middle" font-size="11.5" fill="#64748b">192.168.49.100</text>
  <text x="517" y="656" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">retries across priorities</text>

  <path d="M 627 585 C 645 575, 673 575, 691 583" fill="none" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#aBlue)"/>
  <text x="659" y="502" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1" fill="#60a5fa">P0 · fleet</text>
  <text x="659" y="518" text-anchor="middle" font-size="11" fill="#94a3b8">Envoy proxies the request to the qwen replica's ModelEndpoint</text>

  <rect x="695" y="530" width="215" height="160" rx="14" fill="#11203c" stroke="#3b82f6" stroke-width="1.8" filter="url(#glowBlue)"/>
  <text x="802" y="588" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9">vLLM</text>
  <text x="802" y="612" text-anchor="middle" font-size="12" fill="#93c5fd">Qwen2.5-0.5B · CPU</text>
  <text x="802" y="632" text-anchor="middle" font-size="11" fill="#64748b">DRA cpu claim</text>
  <text x="802" y="652" text-anchor="middle" font-size="10.5" fill="#64748b">×1 replica</text>

  <!-- P1 failover: envoy -> claude, routed under the vLLM box to keep it clear -->
  <path d="M 517 696 C 620 762, 1120 768, 1276 655" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#aAmber)"/>
  <text x="850" y="710" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#fbbf24">P1 · failover</text>
  <text x="850" y="728" text-anchor="middle" font-size="11" fill="#94a3b8">same request · model → claude-haiku-5-5</text>

  <!-- claude external provider (P1) -->
  <rect x="1280" y="530" width="250" height="170" rx="14" fill="#0d1526" stroke="#f59e0b" stroke-width="1.8" filter="url(#glowAmber)"/>
  <rect x="1315" y="517" width="180" height="26" rx="13" fill="#0b1322" stroke="#8a5a12"/>
  <text x="1405" y="534" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#fbbf24">EXTERNAL PROVIDER</text>
  <text x="1405" y="592" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9">Claude</text>
  <text x="1405" y="616" text-anchor="middle" font-size="12" fill="#fbbf24">claude-haiku-5-5</text>
  <text x="1405" y="636" text-anchor="middle" font-size="11" fill="#94a3b8">api.anthropic.com/v1 · OpenAI-compat</text>
  <text x="1405" y="658" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">Anthropic SaaS — not a cluster</text>
  <text x="1405" y="736" text-anchor="middle" font-size="10.5" fill="#64748b">response.model reveals who served — debug view</text>

  <!-- user -->
  <rect x="70" y="545" width="150" height="130" rx="14" fill="#0c1424" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="145" cy="587" r="13" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <path d="M117 625 q28 -24 56 0" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/>
  <text x="145" y="654" text-anchor="middle" font-size="19" font-weight="700" fill="#e5e7eb">User</text>
  <text x="145" y="702" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">never sees which tier answered</text>

  <path d="M 222 600 C 280 592, 340 596, 406 606" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#aGray)"/>
  <text x="300" y="512" text-anchor="middle" font-size="13" font-weight="700" font-family="Menlo, monospace" fill="#e5e7eb">curl · python</text>
  <text x="300" y="530" text-anchor="middle" font-size="11" fill="#94a3b8">OpenAI-compatible API</text>
  <text x="300" y="546" text-anchor="middle" font-size="11" fill="#94a3b8">POST /v1/chat/completions</text>
  <text x="300" y="562" text-anchor="middle" font-size="11" fill="#94a3b8">"model": "ml-team/chat"</text>

  <!-- footer -->
  <text x="90" y="858" font-size="13" font-weight="700" fill="#94a3b8">github.com/umairkhancis/exp-inference-fleet-control</text>
  <text x="1510" y="858" text-anchor="end" font-size="13" fill="#64748b">one model name · two tiers · zero client changes</text>
</svg>
